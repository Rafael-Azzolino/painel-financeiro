<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<title>Controle Financeiro</title>
<style>
  :root{
    --bg:#f4f5f7; --surface:#ffffff; --ink:#15181d; --ink-2:#4a5260; --muted:#7a8291;
    --line:#e3e6eb; --accent:#2f5bd3; --accent-ink:#ffffff; --accent-soft:#e8eefc;
    --bar:#3b66d8; --good:#1f7a4d; --bad:#b42318; --radius:14px;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1115; --surface:#181b21; --ink:#eef0f3; --ink-2:#b4bac5; --muted:#8a92a0;
      --line:#2a2f38; --accent:#7f9cf5; --accent-ink:#0f1115; --accent-soft:#1f2740;
      --bar:#7f9cf5; --good:#5fc28e; --bad:#f07a6e; --shadow:none;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:5;background:#14213d;color:#fff;
    padding:14px 18px;display:flex;align-items:center;gap:12px}
  header h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px;flex:1}
  header .who{font-size:13px;opacity:.8}
  header button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;
    border-radius:10px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
  main{max-width:720px;margin:0 auto;padding:16px 14px 90px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
  h2{font-size:16px;margin:0 0 12px}
  p{margin:0 0 10px;color:var(--ink-2)}
  .muted{color:var(--muted);font-size:13px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;
    background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;
    border-radius:12px;padding:12px 16px;cursor:pointer;min-height:46px}
  .btn.block{width:100%}
  .btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
  .btn:disabled{opacity:.55;cursor:default}
  .seg{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);
    border-radius:12px;padding:4px;margin-bottom:14px}
  .seg button{flex:1;border:0;background:transparent;color:var(--ink-2);font:inherit;
    font-weight:600;padding:10px 6px;border-radius:9px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
  .card .seg{background:var(--bg)}
  label.f{display:block;margin-bottom:14px}
  .f > span{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
  input,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);
    border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:46px}
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  input.money{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
    border-radius:999px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer}
  .chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
  .check{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:14px;color:var(--ink-2)}
  .check input{width:20px;height:20px;min-height:0}
  .preview{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:14px}
  .list{list-style:none;margin:0;padding:0}
  .list li{display:flex;align-items:center;gap:10px;padding:11px 4px;border-top:1px solid var(--line)}
  .list li:first-child{border-top:0}
  .list li.pick{cursor:pointer;border-radius:10px}
  .list li.pick:hover{background:var(--accent-soft)}
  .grow{flex:1;min-width:0}
  .ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .num{font-variant-numeric:tabular-nums;white-space:nowrap}
  .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
  .tile .k{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .tile .v{font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
  .tile .d{font-size:12px;color:var(--muted);margin-top:2px}
  .monthnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .monthnav strong{font-size:17px;text-transform:capitalize}
  .monthnav button{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink);font-size:18px;cursor:pointer}
  .bars .row{display:grid;grid-template-columns:minmax(100px,36%) 1fr auto;gap:10px;align-items:center;padding:7px 0}
  .bars .track{height:12px}
  .bars .fill{height:100%;background:var(--bar);border-radius:0 4px 4px 0;min-width:2px}
  .bars .lbl{font-size:14px}
  .bars .val{font-size:13px;color:var(--ink-2)}
  .tick{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--surface);
    color:transparent;font-size:16px;font-weight:800;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  .tick.on{background:var(--good);border-color:var(--good);color:#fff}
  .tick:disabled{opacity:.5}
  li.paid .grow > div:first-child{color:var(--muted)}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:middle}
  .cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .cardhead h2{margin:0}
  .linkbtn{background:none;border:0;color:var(--accent);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:6px 0}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;
    background:#14213d;color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;
    transition:.25s;z-index:20;max-width:90vw;text-align:center;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{background:var(--bad)}
  .err-box{background:#fdecea;color:#7a1a12;border-radius:10px;padding:12px;font-size:14px;margin-bottom:12px;word-break:break-word}
  @media (prefers-color-scheme: dark){.err-box{background:#3a1d1a;color:#ffd4cf}}
  code{background:var(--accent-soft);padding:2px 6px;border-radius:6px;font-size:13px;word-break:break-all}
  .row-actions{display:flex;gap:8px;flex-wrap:wrap}
  .spinner{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .center{display:flex;align-items:center;justify-content:center;gap:10px;padding:30px;color:var(--muted)}
  .hidden{display:none!important}
</style>
</head>
<body>
<header>
  <h1>Controle Financeiro</h1>
  <span class="who" id="who"></span>
  <button id="btnSettings" class="hidden" title="Configurações">⚙︎</button>
</header>
<main id="app"><div class="center"><div class="spinner"></div>Carregando…</div></main>
<div class="toast" id="toast"></div>

<script>
/* ================== CONFIGURAÇÃO ================== */
const CONFIG = {
  clientId: 'fac940d2-e6ae-4231-94da-f98c1071c957',
  authority: 'https://login.microsoftonline.com/consumers/oauth2/v2.0',
  scopes: 'openid profile offline_access User.Read Files.ReadWrite Files.ReadWrite.All',
  // Nomes dos cartões, na ordem em que os blocos aparecem na aba "Cartões AAAA" (de cima para baixo)
  cards: ['Cartão Ju', 'Cartão Rafa'],
  defaultCategory: 'Compras/Serviços'
};
const REDIRECT_URI = location.origin + location.pathname.replace(/index\.html$/i, '').replace(/([^/])$/, '$1/');
const GRAPH = 'https://graph.microsoft.com/v1.0';

/* ================== UTILITÁRIOS ================== */
const store = {
  get(k, def=null){ try{ const v = localStorage.getItem('cf_'+k); return v==null?def:JSON.parse(v);}catch(e){return def;} },
  set(k, v){ try{ localStorage.setItem('cf_'+k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem('cf_'+k); }catch(e){} }
};
const sess = {
  get(k){ try{ return sessionStorage.getItem('cf_'+k);}catch(e){return null;} },
  set(k,v){ try{ sessionStorage.setItem('cf_'+k, v);}catch(e){} },
  del(k){ try{ sessionStorage.removeItem('cf_'+k);}catch(e){} }
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BRL = new Intl.NumberFormat('pt-BR', {style:'currency', currency:'BRL'});
const fmtBRL = n => BRL.format(n || 0);
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MES3 = MESES.map(m => m.slice(0,3));
const app = $('#app');
const norm = s => String(s ?? '').trim().toLowerCase();
const isBlank = v => v === '' || v == null || (typeof v === 'string' && !v.trim());
const round2 = n => Math.round(n * 100) / 100;
/* Marca de "pago" — fica no começo da descrição, visível também no Excel (ex.: "✔ Enel") */
const PAID = '✔ ';
const PAID_RX = /^\s*[✔✓]\uFE0F?\s*/;

function toast(msg, isErr=false){
  const t = $('#toast'); t.textContent = msg; t.classList.toggle('err', isErr);
  t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), isErr?6000:2600);
}
function loading(msg='Carregando…'){ app.innerHTML = `<div class="center"><div class="spinner"></div>${esc(msg)}</div>`; }

const EXCEL_EPOCH = Date.UTC(1899, 11, 30);
function serialToDate(v){
  if (typeof v !== 'number' || v < 20000 || v > 80000) return null;
  const d = new Date(EXCEL_EPOCH + Math.round(v)*864e5); return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
}
function parseNum(v){
  if (typeof v === 'number') return v;
  if (isBlank(v)) return NaN;
  let s = String(v).replace(/R\$|\s/g,'').trim();
  if (s.includes(',')) s = s.replace(/\./g,'').replace(',', '.');
  return Number(s);
}
const numOr0 = v => { const n = parseNum(v); return isNaN(n) ? 0 : n; };
const pad2 = n => String(n).padStart(2,'0');
const todayISO = () => { const d=new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
const thisMonthISO = () => { const d=new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}`; };

/* Endereços de célula */
function colNum(s){ let n=0; for (const ch of s.toUpperCase()) n = n*26 + ch.charCodeAt(0) - 64; return n; }
function colStr(n){ let s=''; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s; }
function sumRange(formula){
  const m = String(formula||'').match(/SUM\(\s*\$?[A-Z]+\$?(\d+)\s*:\s*\$?[A-Z]+\$?(\d+)\s*\)/i);
  return m ? { r1:+m[1], r2:+m[2] } : null;
}

/* ================== LOGIN (OAuth 2.0 + PKCE) ================== */
function b64url(bytes){ return btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function randomStr(n){ const a = new Uint8Array(n); crypto.getRandomValues(a); return b64url(a); }

async function login(){
  if (location.protocol === 'file:'){
    alert('Este arquivo foi aberto direto do computador. Abra pelo endereço do GitHub Pages: https://rafael-azzolino.github.io/painel-financeiro/');
    return;
  }
  const verifier = randomStr(48), st = randomStr(16);
  sess.set('pkce', verifier); sess.set('state', st);
  const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  const p = new URLSearchParams({
    client_id: CONFIG.clientId, response_type: 'code', redirect_uri: REDIRECT_URI,
    scope: CONFIG.scopes, code_challenge: challenge, code_challenge_method: 'S256',
    state: st, response_mode: 'query', prompt: 'select_account'
  });
  location.assign(`${CONFIG.authority}/authorize?${p}`);
}
async function tokenRequest(params){
  const body = new URLSearchParams({ client_id: CONFIG.clientId, scope: CONFIG.scopes, ...params });
  const r = await fetch(`${CONFIG.authority}/token`, { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body });
  const j = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(j.error_description || j.error || ('Falha no login ('+r.status+')'));
  const tok = { access: j.access_token, refresh: j.refresh_token || (store.get('tok',{})||{}).refresh, exp: Date.now() + (j.expires_in||3600)*1000 };
  store.set('tok', tok); return tok;
}
async function handleRedirect(){
  const q = new URLSearchParams(location.search);
  if (!q.has('code') && !q.has('error')) return null;
  history.replaceState(null, '', REDIRECT_URI);
  if (q.has('error')) throw new Error(q.get('error_description') || q.get('error'));
  if (q.get('state') !== sess.get('state')) throw new Error('Retorno de login inválido. Tente entrar de novo.');
  const tok = await tokenRequest({ grant_type:'authorization_code', code:q.get('code'), redirect_uri:REDIRECT_URI, code_verifier:sess.get('pkce') });
  sess.del('pkce'); sess.del('state'); return tok;
}
async function getToken(force=false){
  const tok = store.get('tok');
  if (!tok) throw new Error('LOGIN');
  if (!force && tok.exp > Date.now() + 60000) return tok.access;
  if (!tok.refresh) throw new Error('LOGIN');
  try { return (await tokenRequest({ grant_type:'refresh_token', refresh_token: tok.refresh })).access; }
  catch(e){ store.del('tok'); throw new Error('LOGIN'); }
}
function logout(){ store.del('tok'); store.del('me'); location.assign(`${CONFIG.authority}/logout?post_logout_redirect_uri=${encodeURIComponent(REDIRECT_URI)}`); }

/* ================== MICROSOFT GRAPH ================== */
async function graph(path, {method='GET', body} = {}, attempt=0){
  const token = await getToken(attempt === 1);
  const r = await fetch(GRAPH + path, {
    method, headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined
  });
  if (r.status === 401 && attempt === 0) return graph(path, {method, body}, 1);
  if ((r.status === 429 || r.status >= 500) && attempt < 2){
    const wait = (Number(r.headers.get('Retry-After')) || 2) * 1000;
    await new Promise(res => setTimeout(res, wait)); return graph(path, {method, body}, attempt+1);
  }
  if (r.status === 204) return null;
  const j = await r.json().catch(()=>null);
  if (!r.ok) throw new Error((j && j.error && j.error.message) || ('Erro ' + r.status));
  return j;
}
// No OneDrive pessoal o ID do item começa com o ID do drive do dono (ex.: "540BF661948D6815!s…").
// Usar esse prefixo garante que a planilha compartilhada seja aberta no drive certo.
const driveOf = f => (f.id && f.id.includes('!')) ? f.id.split('!')[0] : f.driveId;
const wb = () => driveOf(state.file)
  ? `/drives/${encodeURIComponent(driveOf(state.file))}/items/${encodeURIComponent(state.file.id)}/workbook`
  : `/me/drive/items/${encodeURIComponent(state.file.id)}/workbook`;
const shareToken = url => 'u!' + btoa(unescape(encodeURIComponent(url.trim()))).replace(/=+$/,'').replace(/\//g,'_').replace(/\+/g,'-');
const wsPath = ws => `${wb()}/worksheets/${encodeURIComponent(ws.id)}`;

/* ================== ESTADO ================== */
const now = new Date();
const state = {
  file: store.get('file'),
  sheets: [],                 // [{id,name}]
  cache: {},                  // nome da aba -> dados interpretados
  tab: 'lancar',
  dest: store.get('dest', 'conta'),   // 'conta' | 0 | 1 (índice do cartão)
  month: { y: now.getFullYear(), m: now.getMonth() }
};

/* ================== LEITURA DAS ABAS ================== */
const sheetFor = (kind, year) => state.sheets.find(s => kind === 'controle'
  ? new RegExp(`^controle\\s+${year}$`, 'i').test(s.name.trim())
  : new RegExp(`^cart(o|õ)es\\s+${year}$`, 'i').test(s.name.trim()));

function makeGrid(range){
  const ref = range.address.split('!').pop();
  const m = ref.match(/^\$?([A-Z]+)\$?(\d+)/);
  const c0 = colNum(m[1]), r0 = +m[2];
  const V = range.values, F = range.formulas;
  return {
    r0, c0, rMax: r0 + V.length - 1, cMax: c0 + (V[0]||[]).length - 1,
    v: (r,c) => { const row = V[r-r0]; return row && row[c-c0] != null ? row[c-c0] : ''; },
    f: (r,c) => { const row = F[r-r0]; return row && row[c-c0] != null ? row[c-c0] : ''; }
  };
}

function findBlocks(g, check){
  for (let r = g.r0; r <= Math.min(g.r0 + 6, g.rMax); r++){
    const blocks = [];
    for (let c = g.c0; c <= g.cMax; c++){
      if (norm(g.v(r,c)) === 'data' && /descri/i.test(g.v(r,c+1)) && check(r,c)) blocks.push(c);
    }
    if (blocks.length) return { hr: r, blocks };
  }
  return null;
}
function blockMonth(g, hr, c, idx){
  for (let r = hr-1; r >= Math.max(g.r0, hr-2); r--){ const d = serialToDate(g.v(r,c)); if (d) return d.getMonth(); }
  return idx;
}
function firstFree(g, r1, r2, cols){
  for (let r = r1; r <= r2; r++) if (cols.every(c => isBlank(g.v(r,c)))) return r;
  return null;
}

function parseControle(g){
  const h = findBlocks(g, (r,c) => /valor/i.test(g.v(r,c+3)));
  if (!h) throw new Error('Não encontrei os cabeçalhos DATA / Descrição / Categoria / Valor na aba de controle.');
  const months = {};
  h.blocks.forEach((c, idx) => {
    const m = blockMonth(g, h.hr, c, idx);
    let tr = null, ar = null;
    for (let r = h.hr+1; r <= g.rMax; r++){
      const t = norm(g.v(r,c));
      if (tr == null && /^total m[eê]s/.test(t)) tr = r;
      else if (tr != null && t === 'total'){ ar = r; break; }
    }
    const rg = (tr && sumRange(g.f(tr, c+3))) || { r1: h.hr+1, r2: (tr || g.rMax+1) - 1 };
    const items = [];
    for (let r = rg.r1; r <= rg.r2; r++){
      const desc = String(g.v(r,c+1)).trim(), val = g.v(r,c+3);
      if (desc || !isBlank(val)) items.push({ r, day: g.v(r,c), raw: String(g.v(r,c+1)), paid: PAID_RX.test(desc),
        desc: String(g.v(r,c+1)).replace(PAID_RX, '').trim(), cat: String(g.v(r,c+2)).trim(), val: numOr0(val) });
    }
    months[m] = { c, r1: rg.r1, r2: rg.r2, items,
      free: firstFree(g, rg.r1, rg.r2, [c+1, c+2, c+3]),
      total: tr ? numOr0(g.v(tr, c+3)) : items.reduce((s,i)=>s+i.val,0),
      acc: ar ? numOr0(g.v(ar, c+3)) : null };
  });
  return { kind:'controle', months };
}

function parseCartoes(g){
  const h = findBlocks(g, (r,c) => /categ/i.test(g.v(r,c+3)) && /valor/i.test(g.v(r,c+4)));
  if (!h) throw new Error('Não encontrei os cabeçalhos DATA / Descrição / Categoria / Valor na aba de cartões.');
  const months = {};
  h.blocks.forEach((c, idx) => {
    const m = blockMonth(g, h.hr, c, idx);
    const totals = [];
    for (let r = h.hr+1; r <= g.rMax; r++) if (norm(g.v(r,c)) === 'total' || norm(g.v(r,c+1)) === 'total') totals.push(r);
    let prevEnd = h.hr;
    const sections = totals.map((tr, i) => {
      const rg = sumRange(g.f(tr, c+4)) || { r1: prevEnd+1, r2: tr-1 };
      prevEnd = tr;
      const items = [];
      for (let r = rg.r1; r <= rg.r2; r++){
        const desc = String(g.v(r,c+1)).trim(), val = g.v(r,c+4);
        if (norm(desc) === 'descrição' || norm(desc) === 'descricao') continue;
        if (desc || !isBlank(val)) items.push({ r, desc, parc: String(g.v(r,c+2)).trim(), cat: String(g.v(r,c+3)).trim(), val: numOr0(val) });
      }
      return { name: CONFIG.cards[i] || `Cartão ${i+1}`, r1: rg.r1, r2: rg.r2, items,
        free: firstFree(g, rg.r1, rg.r2, [c+1, c+2, c+3, c+4]), total: numOr0(g.v(tr, c+4)) };
    });
    months[m] = { c, sections };
  });
  return { kind:'cartoes', months };
}

async function loadSheet(kind, year, force=false){
  const ws = sheetFor(kind, year);
  if (!ws) return null;
  if (state.cache[ws.name] && !force) return state.cache[ws.name];
  const range = await graph(`${wsPath(ws)}/usedRange?$select=address,values,formulas`);
  const g = makeGrid(range);
  const parsed = kind === 'controle' ? parseControle(g) : parseCartoes(g);
  parsed.ws = ws; parsed.year = year;
  state.cache[ws.name] = parsed;
  return parsed;
}
async function writeRow(ws, c1, c2, r, values){
  const addr = `${colStr(c1)}${r}:${colStr(c2)}${r}`;
  await graph(`${wsPath(ws)}/range(address='${addr}')`, { method:'PATCH', body:{ values:[values] } });
}

/* Sugestões para o formulário */
function suggestions(){
  const descs = {}, contaCats = new Set(), cardCats = new Set();
  Object.values(state.cache).forEach(s => Object.values(s.months).forEach(mo => {
    const items = s.kind === 'controle' ? mo.items : mo.sections.flatMap(x => x.items);
    items.forEach(i => {
      if (i.desc) descs[i.desc] = (descs[i.desc]||0) + 1;
      if (i.cat) (s.kind === 'controle' ? contaCats : cardCats).add(i.cat);
    });
  }));
  const fix = set => { const a = [...set].filter(c => c !== 'compras/Serviços'); if (!a.includes(CONFIG.defaultCategory)) a.unshift(CONFIG.defaultCategory); return a; };
  return {
    descs: Object.keys(descs).sort((a,b) => descs[b]-descs[a]).slice(0, 300),
    contaCats: fix(contaCats).sort((a,b) => a === CONFIG.defaultCategory ? -1 : b === CONFIG.defaultCategory ? 1 : a.localeCompare(b)),
    cardCats: fix(cardCats).sort((a,b) => a === CONFIG.defaultCategory ? -1 : b === CONFIG.defaultCategory ? 1 : a.localeCompare(b))
  };
}

async function showFilePicker(){
  loading('Procurando planilhas no seu OneDrive…');
  let items = [];
  try {
    const [mine, shared] = await Promise.all([
      graph(`/me/drive/root/search(q='xlsx')?$top=200&$select=id,name,parentReference,lastModifiedDateTime,file,remoteItem`),
      graph(`/me/drive/sharedWithMe`).catch(() => ({ value: [] }))
    ]);
    const add = (i, sharedList) => {
      const r = i.remoteItem || i;               // itens compartilhados vêm com remoteItem (o arquivo real, no drive do dono)
      const isShared = sharedList || !!i.remoteItem;
      items.push({ id: r.id, driveId: r.parentReference && r.parentReference.driveId, name: i.name || r.name,
        date: i.lastModifiedDateTime || r.lastModifiedDateTime || '', shared: isShared,
        by: r.shared && r.shared.owner && r.shared.owner.user && r.shared.owner.user.displayName });
    };
    (mine.value||[]).forEach(i => add(i, false));
    (shared.value||[]).forEach(i => add(i, true));
    const seen = new Set();
    items = items.filter(i => /\.xlsx$/i.test(i.name || '') && !seen.has(i.id) && seen.add(i.id))
      .sort((a,b)=> String(b.date).localeCompare(String(a.date)));
  } catch(e){ return showError(e); }
  const pick = f => { state.file = f; store.set('file', f); state.cache = {}; start(); };
  const render = (f='') => {
    const list = items.filter(i => i.name.toLowerCase().includes(f.toLowerCase()));
    $('#files').innerHTML = list.length ? list.map((i, k) => `
      <li class="pick" data-k="${items.indexOf(i)}">
        <div class="grow"><div class="ellipsis"><strong>${esc(i.name)}</strong></div>
        <div class="muted ellipsis">${i.shared ? 'Compartilhada' + (i.by ? ' por ' + esc(i.by) : '') + ' · ' : ''}${i.date ? new Date(i.date).toLocaleDateString('pt-BR') : ''}</div></div>
      </li>`).join('') : `<li><span class="muted">Nenhuma planilha .xlsx encontrada.</span></li>`;
    document.querySelectorAll('#files li.pick').forEach(li => li.onclick = () => {
      const i = items[+li.dataset.k]; pick({ id: i.id, driveId: i.driveId, name: i.name });
    });
  };
  app.innerHTML = `
    <div class="card">
      <h2>Qual é a sua planilha de controle financeiro?</h2>
      <label class="f"><input id="q" placeholder="Filtrar pelo nome…" autocomplete="off"></label>
      <ul class="list" id="files"></ul>
    </div>
    <div class="card">
      <h2>Planilha compartilhada com você?</h2>
      <p class="muted">Se ela não aparecer na lista, cole aqui o link que você recebeu por e-mail.</p>
      <label class="f"><input id="shareUrl" placeholder="https://1drv.ms/… ou https://onedrive.live.com/…" autocomplete="off"></label>
      <button class="btn ghost block" id="btnShare">Abrir pelo link</button>
    </div>`;
  render(); $('#q').oninput = e => render(e.target.value);
  $('#btnShare').onclick = async () => {
    const url = $('#shareUrl').value; if (!url.trim()) return;
    const b = $('#btnShare'); b.disabled = true; b.textContent = 'Abrindo…';
    try {
      const it = await graph(`/shares/${shareToken(url)}/driveItem?$select=id,name,parentReference`);
      pick({ id: it.id, driveId: it.parentReference && it.parentReference.driveId, name: it.name });
    } catch(e){ b.disabled = false; b.textContent = 'Abrir pelo link'; toast('Não consegui abrir esse link: ' + e.message, true); }
  };
}

const currentCat = () => { const on = document.querySelector('#fCat .chip.on'); return on ? on.dataset.v : CONFIG.defaultCategory; };
const currentModo = () => { const on = document.querySelector('#fModo .chip.on'); return on ? on.dataset.v : 'total'; };

/* Monta o plano de gravação (onde cada linha vai entrar) */
async function buildPlan(load){
  const v = parseNum($('#fValor').value);
  const desc = $('#fDesc').value.trim();
  const cat = currentCat();
  if (isNaN(v) || v <= 0) return { error: 'Informe um valor maior que zero.' };
  if (!desc) return { error: 'Informe a descrição.' };

  if (state.dest === 'conta'){
    const iso = $('#fData').value; if (!iso) return { error: 'Informe a data.' };
    const [y, m, d] = iso.split('-').map(Number);
    const sheet = load ? await loadSheet('controle', y) : state.cache[(sheetFor('controle', y)||{}).name];
    if (!sheetFor('controle', y)) return { error: `Não existe a aba "Controle ${y}" na planilha.` };
    if (!sheet) return { pending: true, text: `Controle ${y} › ${MESES[m-1]}` };
    const blk = sheet.months[m-1];
    if (!blk) return { error: `Não achei o bloco de ${MESES[m-1]} na aba Controle ${y}.` };
    if (!blk.free) return { error: `O bloco de ${MESES[m-1]} está cheio até a linha do TOTAL MES. Insira linhas em branco antes dela no Excel.` };
    const value = /receita/i.test(cat) ? v : -v;
    return { rows: [{ sheet, c1: blk.c, c2: blk.c+3, r: blk.free, values: [d, PAID + desc, cat, value] }],
      text: `Entra em <strong>Controle ${y} › ${MESES[m-1]}</strong>, linha ${blk.free}, como <strong>${fmtBRL(value)}</strong>, já marcado como pago.` };
  }

  // Cartão
  const fat = $('#fFatura').value; if (!fat) return { error: 'Informe o mês da fatura.' };
  const [fy, fm] = fat.split('-').map(Number);
  const n = +$('#fParc').value || 1;
  $('#wrapModo').classList.toggle('hidden', n === 1);
  const estorno = $('#fEstorno').checked;
  const each = (n > 1 && currentModo() === 'total') ? Math.floor(v * 100 / n) / 100 : v;
  const amounts = Array.from({length:n}, (_,k) => (n > 1 && currentModo() === 'total' && k === n-1) ? round2(v - each*(n-1)) : each);
  const rows = [], missing = [];
  for (let k = 0; k < n; k++){
    const idx = (fm - 1) + k, y = fy + Math.floor(idx / 12), m = idx % 12;
    if (!sheetFor('cartoes', y)){ missing.push(`${MES3[m]}/${String(y).slice(2)}`); continue; }
    const sheet = load ? await loadSheet('cartoes', y) : state.cache[sheetFor('cartoes', y).name];
    if (!sheet) return { pending: true, text: 'Verificando a aba de cartões…' };
    const blk = sheet.months[m]; const sec = blk && blk.sections[state.dest];
    if (!sec) return { error: `Não achei o bloco do ${CONFIG.cards[state.dest]} em ${MESES[m]}/${y}.` };
    // várias parcelas nunca caem no mesmo bloco, então a primeira linha livre basta
    if (!sec.free) return { error: `O ${sec.name} de ${MESES[m]}/${y} está cheio até a linha do Total. Insira linhas em branco antes dela no Excel.` };
    const val = estorno ? amounts[k] : -amounts[k];
    rows.push({ sheet, c1: blk.c+1, c2: blk.c+4, r: sec.free, values: [desc, n > 1 ? `${k+1}/${n}` : '-', cat, val], label: `${MES3[m]}/${String(y).slice(2)}` });
  }
  const card = CONFIG.cards[state.dest];
  let text = n === 1
    ? `Entra no <strong>${esc(card)}</strong>, fatura de <strong>${MESES[fm-1]}/${fy}</strong>, como <strong>${fmtBRL(rows[0] ? rows[0].values[3] : (estorno?v:-v))}</strong>.`
    : `<strong>${n}x de ${fmtBRL(amounts[0])}</strong> no <strong>${esc(card)}</strong>, de ${MES3[fm-1]}/${String(fy).slice(2)} até ${rows.length ? rows[rows.length-1].label : '—'}.`;
  if (missing.length) text += `<br><span style="color:var(--bad)">${missing.length} parcela(s) (${missing.join(', ')}) ficam de fora: a aba de cartões desse ano ainda não existe.</span>`;
  return { rows, text, missing };
}

let previewSeq = 0;
async function updatePreview(){
  const seq = ++previewSeq, box = $('#preview'); if (!box) return;
  try {
    let plan = await buildPlan(false);
    if (plan.pending){ box.innerHTML = esc(plan.text) + '…'; plan = await buildPlan(true); }
    if (seq !== previewSeq) return;
    box.innerHTML = plan.error ? `<span class="muted">${esc(plan.error)}</span>` : plan.text;
  } catch(e){ if (seq === previewSeq) box.innerHTML = `<span style="color:var(--bad)">${esc(e.message)}</span>`; }
}

async function submitEntry(ev){
  ev.preventDefault();
  const btn = $('#btnSave');
  btn.disabled = true; btn.innerHTML = '<div class="spinner"></div> Gravando…';
  const keep = { cat: currentCat(), data: $('#fData') && $('#fData').value, fatura: $('#fFatura') && $('#fFatura').value };
  try {
    // relê as abas envolvidas para não sobrescrever nada que mudou no Excel
    const touched = new Set();
    let plan = await buildPlan(true);
    if (plan.error){ toast(plan.error, true); btn.disabled=false; btn.textContent='Lançar na planilha'; return; }
    plan.rows.forEach(r => touched.add(r.sheet));
    for (const s of touched) await loadSheet(s.kind, s.year, true);
    plan = await buildPlan(true);
    if (plan.error){ toast(plan.error, true); btn.disabled=false; btn.textContent='Lançar na planilha'; return; }
    if (plan.missing && plan.missing.length && !confirm(`${plan.missing.length} parcela(s) não serão lançadas porque a aba de cartões do próximo ano não existe. Lançar as outras?`)){
      btn.disabled=false; btn.textContent='Lançar na planilha'; return;
    }
    for (const row of plan.rows) await writeRow(row.sheet.ws, row.c1, row.c2, row.r, row.values);
    const total = plan.rows.reduce((s,r) => s + r.values[3], 0);
    for (const s of new Set(plan.rows.map(r => r.sheet))) await loadSheet(s.kind, s.year, true);
    toast(plan.rows.length > 1 ? `${plan.rows.length} parcelas lançadas ✓` : `Lançado ${fmtBRL(total)} ✓`);
    renderForm(keep);
  } catch(e){
    if (e.message === 'LOGIN') return showLogin('Sua sessão expirou. Entre de novo — o lançamento não foi gravado.');
    toast('Não gravou: ' + e.message, true);
    btn.disabled = false; btn.textContent = 'Lançar na planilha';
  }
}

async function setPaid(sheet, blk, item, paid){
  const addr = `${colStr(blk.c+1)}${item.r}`;
  // confere se a linha ainda é a mesma antes de gravar (evita marcar a linha errada se a planilha mudou)
  const cur = await graph(`${wsPath(sheet.ws)}/range(address='${addr}')?$select=values`);
  const curText = String((cur.values && cur.values[0] && cur.values[0][0]) ?? '');
  if (curText.replace(PAID_RX, '').trim() !== item.desc.trim())
    throw new Error('Essa linha mudou na planilha. Toque em "Atualizar dados da planilha" e tente de novo.');
  const text = paid ? PAID + item.desc : item.desc;
  await graph(`${wsPath(sheet.ws)}/range(address='${addr}')`, { method:'PATCH', body:{ values:[[text]] } });
  item.paid = paid; item.raw = text;
}

const dayNum = i => { const n = parseInt(i.day, 10); return isNaN(n) ? 99 : n; };
function itemRow(i, opts = {}){
  const label = i.val > 0 ? 'recebido' : 'pago';
  return `<li class="${i.paid ? 'paid' : ''}">
    <button class="tick ${i.paid ? 'on' : ''}" data-r="${i.r}" aria-pressed="${i.paid}" title="${i.paid ? 'Marcado como ' + label + ' — toque para desmarcar' : 'Marcar como ' + label}">✓</button>
    <div class="grow"><div class="ellipsis">${esc(i.desc || '—')}</div>
      <div class="muted ellipsis">${i.day !== '' && i.day != null ? 'dia ' + esc(i.day) + ' · ' : ''}${esc(i.cat || 'sem categoria')}${i.paid ? ' · ' + label : ''}</div></div>
    <div class="num" style="${i.val > 0 ? 'color:var(--good)' : ''}">${i.val > 0 ? '+' : ''}${fmtBRL(Math.abs(i.val))}</div>
  </li>`;
}

async function renderSummary(){
  const {y, m} = state.month;
  const view = $('#view');
  if (!state.cache[(sheetFor('controle', y)||{}).name]) view.innerHTML = `<div class="center"><div class="spinner"></div>Lendo ${MESES[m]}/${y}…</div>`;
  let ctl, crt;
  try { [ctl, crt] = await Promise.all([loadSheet('controle', y), loadSheet('cartoes', y)]); }
  catch(e){ return showError(e); }
  const nav = `
    <div class="monthnav">
      <button id="mPrev" aria-label="Mês anterior">‹</button>
      <strong>${MESES[m]} ${y}</strong>
      <button id="mNext" aria-label="Próximo mês">›</button>
    </div>`;
  const bindNav = () => {
    $('#mPrev').onclick = () => { state.month = m === 0 ? {y:y-1, m:11} : {y, m:m-1}; state.showAll = false; renderSummary(); };
    $('#mNext').onclick = () => { state.month = m === 11 ? {y:y+1, m:0} : {y, m:m+1}; state.showAll = false; renderSummary(); };
  };
  const blk = ctl && ctl.months[m];
  if (!blk){ view.innerHTML = nav + `<div class="card"><p>Não há a aba <strong>Controle ${y}</strong> ou o bloco deste mês.</p></div>`; return bindNav(); }

  const items = blk.items.filter(i => i.val !== 0);
  const saidas = items.filter(i => i.val < 0);
  const receitas = items.filter(i => i.val > 0).reduce((s,i)=>s+i.val,0);
  const despesas = saidas.reduce((s,i)=>s-i.val,0);
  const aPagar = saidas.filter(i => !i.paid).sort((a,b) => dayNum(a)-dayNum(b) || a.r-b.r);
  const aReceber = items.filter(i => i.val > 0 && !i.paid).sort((a,b) => dayNum(a)-dayNum(b) || a.r-b.r);
  const faltaPagar = aPagar.reduce((s,i)=>s-i.val,0);
  const ultimas = [...saidas].sort((a,b) => b.r - a.r);            // ordem em que foram lançadas (mais recentes primeiro)
  const ultimasVis = state.showAll ? ultimas : ultimas.slice(0, 10);
  const byCat = {};
  saidas.forEach(i => { const k = i.cat || 'Sem categoria'; byCat[k] = (byCat[k]||0) - i.val; });
  const cats = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const maxCat = cats.length ? cats[0][1] : 0;
  const cardBlk = crt && crt.months[m];
  const saldo = blk.total;

  view.innerHTML = nav + `
    <div class="tiles">
      <div class="tile"><div class="k">Receitas</div><div class="v">${fmtBRL(receitas)}</div></div>
      <div class="tile"><div class="k">Saídas</div><div class="v">${fmtBRL(despesas)}</div></div>
      <div class="tile"><div class="k">Falta pagar</div><div class="v" style="color:${faltaPagar>0?'var(--bad)':'var(--good)'}">${fmtBRL(faltaPagar)}</div><div class="d">${aPagar.length ? aPagar.length + ' conta(s) em aberto' : 'tudo pago'}</div></div>
      <div class="tile"><div class="k">Saldo do mês</div><div class="v" style="color:${saldo>=0?'var(--good)':'var(--bad)'}">${fmtBRL(saldo)}</div><div class="d">acumulado: ${blk.acc==null?'—':fmtBRL(blk.acc)}</div></div>
    </div>

    <div class="card">
      <div class="cardhead"><h2>A pagar${aPagar.length ? `<span class="pill">${aPagar.length}</span>` : ''}</h2>
        ${aPagar.length > 1 ? `<button class="linkbtn" id="payAll">Marcar todas como pagas</button>` : ''}</div>
      ${aPagar.length ? `<ul class="list" data-list="pagar">${aPagar.map(i => itemRow(i)).join('')}</ul>` : '<p class="muted">Nenhuma conta em aberto neste mês.</p>'}
      ${aReceber.length ? `<h2 style="margin-top:16px">A receber<span class="pill">${aReceber.length}</span></h2><ul class="list">${aReceber.map(i => itemRow(i)).join('')}</ul>` : ''}
    </div>

    <div class="card">
      <h2>Últimas saídas</h2>
      ${ultimas.length ? `<ul class="list">${ultimasVis.map(i => itemRow(i)).join('')}</ul>
        ${ultimas.length > 10 ? `<button class="linkbtn" id="toggleAll">${state.showAll ? 'Mostrar menos' : `Ver todas (${ultimas.length})`}</button>` : ''}`
      : '<p class="muted">Nada lançado neste mês.</p>'}
    </div>

    ${cardBlk ? `<div class="card"><h2>Faturas dos cartões</h2><ul class="list">${cardBlk.sections.map(s => `
      <li><div class="grow">${esc(s.name)} <span class="muted">· ${s.items.length} itens</span></div><div class="num">${fmtBRL(Math.abs(s.total))}</div></li>`).join('')}</ul></div>` : ''}

    <div class="card">
      <h2>Saídas por categoria</h2>
      ${cats.length ? `<div class="bars">${cats.map(([k,v]) => `
        <div class="row" title="${esc(k)}: ${fmtBRL(v)}">
          <div class="lbl ellipsis">${esc(k)}</div>
          <div class="track"><div class="fill" style="width:${(v/maxCat*100).toFixed(1)}%"></div></div>
          <div class="val num">${fmtBRL(v)} · ${(v/despesas*100).toFixed(0)}%</div>
        </div>`).join('')}</div>` : '<p class="muted">Nenhuma saída neste mês.</p>'}
    </div>
    <button class="btn ghost block" id="btnReload">Atualizar dados da planilha</button>`;

  bindNav();
  $('#btnReload').onclick = () => { state.cache = {}; renderSummary(); };
  const t = $('#toggleAll'); if (t) t.onclick = () => { state.showAll = !state.showAll; renderSummary(); };

  view.querySelectorAll('.tick').forEach(btn => btn.onclick = async () => {
    const item = blk.items.find(i => i.r === +btn.dataset.r); if (!item) return;
    const to = !item.paid;
    view.querySelectorAll(`.tick[data-r="${item.r}"]`).forEach(b => { b.disabled = true; b.classList.toggle('on', to); });
    try { await setPaid(ctl, blk, item, to); toast(to ? (item.val > 0 ? 'Marcado como recebido ✓' : 'Marcado como pago ✓') : 'Desmarcado'); }
    catch(e){ if (e.message === 'LOGIN') return showLogin('Sua sessão expirou. Entre de novo.'); toast(e.message, true); }
    renderSummary();
  });

  const pa = $('#payAll');
  if (pa) pa.onclick = async () => {
    if (!confirm(`Marcar ${aPagar.length} conta(s) de ${MESES[m]} como pagas (${fmtBRL(faltaPagar)})?`)) return;
    pa.disabled = true;
    let ok = 0;
    for (const item of aPagar){
      pa.textContent = `Marcando ${ok+1}/${aPagar.length}…`;
      try { await setPaid(ctl, blk, item, true); ok++; }
      catch(e){ toast(e.message, true); break; }
    }
    if (ok) toast(`${ok} conta(s) marcadas como pagas ✓`);
    renderSummary();
  };
}

/* ================== CONFIGURAÇÕES ================== */
function showSettings(){
  $('#btnSettings').classList.add('hidden');
  app.innerHTML = `
    <div class="card">
      <h2>Configurações</h2>
      <p><strong>Planilha:</strong> ${esc(state.file && state.file.name)}</p>
      <p class="muted">Abas encontradas: ${esc(state.sheets.map(s => s.name).join(', '))}</p>
      <p class="muted">O painel grava nas abas <strong>Controle AAAA</strong> (lançamentos da conta) e <strong>Cartões AAAA</strong> (${esc(CONFIG.cards.join(' e '))}), sempre na primeira linha livre do mês, dentro da faixa que a linha de total soma. Para um ano novo, basta criar as abas com o mesmo modelo (ex.: duplicar "Controle 2026" como "Controle 2027").</p>
      <div class="row-actions"><button class="btn ghost" id="sFile">Trocar planilha</button><button class="btn ghost" id="sBack">Voltar</button><button class="btn ghost" id="sOut">Sair da conta</button></div>
    </div>`;
  $('#sFile').onclick = () => { $('#btnSettings').classList.remove('hidden'); showFilePicker(); };
  $('#sBack').onclick = () => renderMain();
  $('#sOut').onclick = logout;
}
$('#btnSettings').onclick = () => state.sheets.length ? showSettings() : null;

/* ================== INICIALIZAÇÃO ================== */
async function start(){
  loading('Lendo a planilha…');
  try {
    const j = await graph(`${wb()}/worksheets?$select=id,name`);
    state.sheets = (j.value || []).map(s => ({ id: s.id, name: s.name }));
    const y = now.getFullYear();
    if (!sheetFor('controle', y) && !sheetFor('cartoes', y)){
      return showError(new Error(`Não encontrei as abas "Controle ${y}" e "Cartões ${y}" em ${state.file.name}.`));
    }
    await Promise.all([loadSheet('controle', y), loadSheet('cartoes', y)]);
    renderMain();
  } catch(e){ showError(e); }
}
async function boot(){
  try { await handleRedirect(); } catch(e){ return showLogin(e.message); }
  if (!store.get('tok')) return showLogin();
  try {
    let me = store.get('me');
    if (!me){ me = await graph('/me?$select=displayName'); store.set('me', me); }
    $('#who').textContent = (me.displayName || '').split(' ')[0];
    if (!state.file) return showFilePicker();
    start();
  } catch(e){ showError(e); }
}
boot();
</script>
